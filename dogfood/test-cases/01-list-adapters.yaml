# Dogfood Test: Can EvalView chat explain available adapters?

name: "List Adapters Knowledge"
description: "Test that EvalView chat knows about available adapters"

input:
  query: "Run `evalview adapters` now and explain which adapters EvalView supports."
  context:
    allowed_commands: ["evalview adapters"]

expected:
  tools:
    - evalview_cli
  output:
    contains:
      - "http"
      - "langgraph"
      - "anthropic"
    not_contains:
      - "I don't know"
      - "error"

thresholds:
  min_score: 70
  max_cost: 0.05
  max_latency: 180000
