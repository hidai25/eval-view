name: Live Provider Checks

# Separate run history: paid integration evidence is never a daily core gate.
on:
  workflow_dispatch:
    inputs:
      confirm_paid_api:
        description: 'Run live OpenAI tests using paid API credits'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: live-provider-checks
  cancel-in-progress: false

jobs:
  live:
    name: Live Provider Tests
    runs-on: ubuntu-latest
    # Paid stages keep their own 1/5/8-minute limits. Leave reporting headroom.
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CI: '1'

    steps:
    - name: Require explicit paid-test consent on main
      id: consent
      env:
        CONFIRM_PAID_API: ${{ inputs.confirm_paid_api }}
      run: |
        if [ "$GITHUB_REF" != 'refs/heads/main' ] || [ "$CONFIRM_PAID_API" != 'true' ]; then
          echo 'Live checks NOT RUN: select main and explicitly confirm paid API use.' >> "$GITHUB_STEP_SUMMARY"
          echo '::error::Live checks require main and confirm_paid_api=true. No provider requests were made.'
          exit 1
        fi

    - uses: actions/checkout@v5
      timeout-minutes: 1

    - name: Set up Python
      timeout-minutes: 1
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install uv
      timeout-minutes: 1
      run: pip install uv

    - name: Install dependencies
      timeout-minutes: 2
      run: uv sync --all-extras

    - name: Check live provider access and quota
      id: provider
      timeout-minutes: 1
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: bash dogfood/run-check.sh provider uv run python -m dogfood.preflight

    - name: Run live LLM evaluator tests
      id: pytest_llm
      if: steps.provider.outcome == 'success'
      timeout-minutes: 5
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: bash dogfood/run-check.sh pytest-llm uv run pytest tests/ -v --tb=short -x -m requires_api_key

    - name: Run live chat-agent self-tests
      id: dogfood
      if: steps.provider.outcome == 'success' && steps.pytest_llm.outcome == 'success'
      timeout-minutes: 8
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        mkdir -p .evalview
        cp dogfood/config.yaml .evalview/config.yaml
        uv run python dogfood/agent.py > dogfood-agent.log 2>&1 &
        AGENT_PID=$!
        cleanup() {
          kill "$AGENT_PID" 2>/dev/null || true
          wait "$AGENT_PID" 2>/dev/null || true
          cat dogfood-agent.log >> dogfood-output.txt
        }
        trap cleanup EXIT
        AGENT_READY=false
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8001/health > /dev/null; then
            AGENT_READY=true
            break
          fi
          sleep 1
        done
        if [ "$AGENT_READY" = false ]; then
          echo 'Dogfood agent failed to start within 30s' | tee dogfood-output.txt
          exit 1
        fi
        # No whole-agent retries: they can repeat paid provider calls.
        bash dogfood/run-check.sh dogfood uv run evalview run dogfood/test-cases/ --sequential --timeout 120 --max-retries 0

    - name: Summarize live results
      id: check
      timeout-minutes: 1
      if: always() && steps.consent.outcome == 'success'
      env:
        DOGFOOD_SCOPE: live
        CHECK_STEPS: ${{ toJSON(steps) }}
      run: uv run python -m dogfood.summarize

    - name: Preserve live-provider evidence
      timeout-minutes: 2
      if: always() && steps.consent.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: live-dogfood-evidence-${{ github.run_id }}
        retention-days: 30
        include-hidden-files: true
        path: |
          *-output.txt
          *-agent.log
          .evalview/results/
          .evalview/reports/

    - name: Update live-provider issue only
      timeout-minutes: 1
      if: always() && steps.consent.outcome == 'success' && github.ref == 'refs/heads/main'
      uses: actions/github-script@v7
      env:
        DOGFOOD_SCOPE: live
        HAS_FAILURES: ${{ steps.check.outputs.has_failures }}
        FAILED_CHECKS: ${{ steps.check.outputs.failed }}
      with:
        script: |
          const updateIssue = require('./dogfood/update-issue.cjs');
          await updateIssue({github, context, core});

    - name: Enforce live result
      if: always()
      env:
        HAS_FAILURES: ${{ steps.check.outputs.has_failures }}
      run: test "$HAS_FAILURES" = false
