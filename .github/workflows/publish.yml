name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Validate release version and changelog
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: python scripts/check_release.py --tag "$RELEASE_TAG"

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Validate built distributions and installed CLI
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: python scripts/check_release.py --tag "$RELEASE_TAG" --dist dist --smoke

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
