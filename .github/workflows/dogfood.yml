name: Daily Dogfood

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dogfood:
    name: Dogfood Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: '1'

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Run pytest (deterministic tests)
      id: pytest
      continue-on-error: true
      run: bash dogfood/run-check.sh pytest uv run pytest tests/ -v --tb=short -m 'not requires_api_key' --ignore=tests/test_dogfood_e2e.py

    - name: Check live provider access and quota
      id: provider
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: bash dogfood/run-check.sh provider uv run python -m dogfood.preflight

    - name: Run pytest (live LLM evaluator tests)
      id: pytest_llm
      if: steps.provider.outcome == 'success'
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: bash dogfood/run-check.sh pytest-llm uv run pytest tests/ -v --tb=short -m requires_api_key

    - name: Run mypy
      id: mypy
      continue-on-error: true
      run: bash dogfood/run-check.sh mypy uv run mypy evalview/

    - name: Run evalview demo
      id: demo
      continue-on-error: true
      run: bash dogfood/run-check.sh demo uv run evalview demo

    - name: Run evalview --help
      id: help
      continue-on-error: true
      run: bash dogfood/run-check.sh help uv run evalview --help

    - name: Run e2e dogfood tests (mock agent)
      id: dogfood_e2e
      continue-on-error: true
      run: bash dogfood/run-check.sh dogfood-e2e uv run pytest tests/test_dogfood_e2e.py -v --tb=short

    - name: Regression check (EvalView evaluating itself)
      id: regression
      continue-on-error: true
      run: |
        uv run python dogfood/mock_agent.py > mock-agent.log 2>&1 &
        MOCK_PID=$!
        trap 'kill "$MOCK_PID" 2>/dev/null || true; wait "$MOCK_PID" 2>/dev/null || true' EXIT
        AGENT_READY=false
        for i in $(seq 1 15); do
          if curl -sf http://localhost:8002/health > /dev/null; then
            AGENT_READY=true
            break
          fi
          sleep 1
        done
        if [ "$AGENT_READY" = false ]; then
          echo 'Mock agent failed to start within 15s' | tee regression-output.txt
          exit 1
        fi

        mkdir -p .evalview
        cp dogfood/mock-agent-tests/config.yaml .evalview/config.yaml
        # pipefail preserves a failed snapshot; never check against stale goldens.
        uv run evalview snapshot --path dogfood/mock-agent-tests/ --no-judge 2>&1 | tee snapshot-output.txt
        uv run evalview check dogfood/mock-agent-tests/ --fail-on REGRESSION --no-judge --json 2>&1 | tee regression-output.txt

    - name: Monitor smoke test
      id: monitor
      if: steps.regression.outcome == 'success'
      continue-on-error: true
      run: |
        uv run python dogfood/mock_agent.py > monitor-agent.log 2>&1 &
        MOCK_PID=$!
        trap 'kill "$MOCK_PID" 2>/dev/null || true; wait "$MOCK_PID" 2>/dev/null || true' EXIT
        AGENT_READY=false
        for i in $(seq 1 15); do
          if curl -sf http://localhost:8002/health > /dev/null; then
            AGENT_READY=true
            break
          fi
          sleep 1
        done
        if [ "$AGENT_READY" = false ]; then
          echo 'Mock agent failed to start within 15s' | tee monitor-output.txt
          exit 1
        fi

        # SIGTERM at 35s is intentional; other errors must remain failures.
        set +e
        timeout --preserve-status 35s uv run evalview monitor dogfood/mock-agent-tests/ \
          --interval 10 --timeout 15 --fail-on REGRESSION \
          --history .evalview/monitor-history.jsonl 2>&1 | tee monitor-output.txt
        MONITOR_EXIT=${PIPESTATUS[0]}
        set -e
        if [ ! -s .evalview/noise.jsonl ]; then
          echo 'FAIL: monitor did not populate .evalview/noise.jsonl' | tee -a monitor-output.txt
          exit 1
        fi
        if [ "$MONITOR_EXIT" != 0 ] && [ "$MONITOR_EXIT" != 143 ]; then
          exit "$MONITOR_EXIT"
        fi

    - name: Run dogfood self-tests (chat mode)
      id: dogfood
      if: steps.provider.outcome == 'success'
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        mkdir -p .evalview
        cp dogfood/config.yaml .evalview/config.yaml
        uv run python dogfood/agent.py > dogfood-agent.log 2>&1 &
        AGENT_PID=$!
        cleanup() {
          kill "$AGENT_PID" 2>/dev/null || true
          wait "$AGENT_PID" 2>/dev/null || true
          cat dogfood-agent.log >> dogfood-output.txt
        }
        trap cleanup EXIT
        AGENT_READY=false
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8001/health > /dev/null; then
            AGENT_READY=true
            break
          fi
          sleep 1
        done
        if [ "$AGENT_READY" = false ]; then
          echo 'Dogfood agent failed to start within 30s' | tee dogfood-output.txt
          exit 1
        fi
        bash dogfood/run-check.sh dogfood uv run evalview run dogfood/test-cases/ --sequential --timeout 120

    - name: Check for failures
      id: check
      if: always()
      env:
        CHECK_STEPS: ${{ toJSON(steps) }}
      run: uv run python -m dogfood.summarize

    - name: Preserve dogfood evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dogfood-evidence-${{ github.run_id }}
        retention-days: 30
        include-hidden-files: true
        path: |
          *-output.txt
          *-agent.log
          .evalview/results/
          .evalview/reports/
          .evalview/golden/
          .evalview/monitor-history.jsonl
          .evalview/noise.jsonl

    - name: Update rolling dogfood issue
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          // Missing aggregation evidence must never close a failing issue.
          const hasFailures = '${{ steps.check.outputs.has_failures }}' !== 'false';
          const failed = ('${{ steps.check.outputs.failed }}' || 'workflow-setup').split(',');
          const date = new Date().toISOString().split('T')[0];
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const title = '🐕 Daily dogfood is failing';
          try {
            await github.rest.issues.createLabel({
              ...context.repo, name: 'dogfood', color: 'FFA500',
              description: 'Daily self-testing failures',
            });
          } catch (e) {
            if (e.status !== 422) throw e;
          }
          const { data: issues } = await github.rest.issues.listForRepo({
            ...context.repo, state: 'open', labels: 'dogfood', per_page: 100,
          });
          const rolling = issues.find(i => !i.pull_request && i.title === title);
          if (!hasFailures) {
            if (rolling) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: rolling.number,
                body: `✅ All deterministic and live dogfood checks passed on ${date}.\n\n[Run](${runUrl})`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: rolling.number, state: 'closed',
              });
            }
            return;
          }
          let body = `## ${date}\n\nFailed or blocked checks: ${failed.map(c => `\`${c}\``).join(', ')}\n\n`;
          if (failed.includes('provider')) {
            body += 'The provider preflight failed. Live checks are blocked; no claim about agent quality can be made from this run. Restore provider credentials, quota, or availability and rerun.\n\n';
          }
          for (const check of failed) {
            body += `### ❌ ${check}\n\n`;
            try {
              const output = fs.readFileSync(`${check}-output.txt`, 'utf8');
              body += '```text\n' + output.slice(-3000) + '\n```\n\n';
            } catch (e) {
              body += 'No output recorded (the check may be blocked or not started). See the workflow and evidence artifact.\n\n';
            }
          }
          body += `Full logs and reports are preserved in the **dogfood-evidence** artifact.\n\n[View workflow run](${runUrl})`;
          if (rolling) {
            await github.rest.issues.createComment({ ...context.repo, issue_number: rolling.number, body });
          } else {
            await github.rest.issues.create({
              ...context.repo, title, labels: ['dogfood'],
              body: 'This rolling issue closes only when all deterministic and live checks pass.\n\n' + body,
            });
          }

    - name: Enforce dogfood result
      if: always()
      env:
        HAS_FAILURES: ${{ steps.check.outputs.has_failures }}
      run: test "$HAS_FAILURES" = false
